name: Test local RAG and Streamlit app
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy PyMuPDF requests
      - run: python -m compileall -q rag_local.py app.py benchmark.py
      - run: python -m pytest tests -q
